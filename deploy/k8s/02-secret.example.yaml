# TEMPLATE ONLY - every value below is a placeholder, never a real credential.
#
# deploy.sh copies this file to 02-secret.yaml (gitignored, never committed) on first
# run if 02-secret.yaml doesn't already exist, and will refuse to proceed until every
# REPLACE_ME placeholder in that copy has been edited to a real value.
#
# RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET / SMTP_PASSWORD may be left as
# REPLACE_ME_OPTIONAL if you don't use that feature yet (payments/email simply won't
# work until set - the app does not crash without them, per apps/api's existing
# graceful-degradation behavior already validated in earlier phases).
#
# JWT_SECRET/JWT_EXPIRY: present in apps/api/.env for parity, but NOT currently read by
# any application code (grepped - zero matches outside .env itself). Sessions actually
# use a random opaque token stored in the Session table, not a signed JWT. Kept here so
# the Secret's variable names exactly match the real .env, not because the app needs it.
#
# ADMIN_EMAIL/ADMIN_PASSWORD: only consumed by apps/api/prisma/seed.ts (the `pnpm
# db:seed` script), not required for the app to boot or serve traffic.
apiVersion: v1
kind: Secret
metadata:
  name: premal-api-secrets
  namespace: premal-kaizen
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_OPTIONAL"
  JWT_EXPIRY: "7d"
  ADMIN_EMAIL: "REPLACE_ME_OPTIONAL"
  ADMIN_PASSWORD: "REPLACE_ME_OPTIONAL"
  RAZORPAY_KEY_ID: "REPLACE_ME_OPTIONAL"
  RAZORPAY_KEY_SECRET: "REPLACE_ME_OPTIONAL"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME_OPTIONAL"
  SMTP_HOST: "REPLACE_ME_OPTIONAL"
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE_ME_OPTIONAL"
  SMTP_PASSWORD: "REPLACE_ME_OPTIONAL"
  EMAIL_FROM: "REPLACE_ME_OPTIONAL"
