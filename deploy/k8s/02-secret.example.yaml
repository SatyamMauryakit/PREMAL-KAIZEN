# Copy to 02-secret.yaml (gitignored - never commit it) and fill in real values
# before applying. Every REPLACE_ME value below is a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: premal-api-secrets
  namespace: premal-kaizen
type: Opaque
stringData:
  # PostgreSQL - also consumed directly by 03-postgres.yaml's StatefulSet to
  # initialize the database on first boot, and by the migration Job/API Deployment
  # to build DATABASE_URL (postgresql://POSTGRES_USER:POSTGRES_PASSWORD@premal-postgres:5432/POSTGRES_DB).
  POSTGRES_USER: "premal"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "premal_kaizen"

  # Razorpay - https://dashboard.razorpay.com -> Settings -> API Keys / Webhooks
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME"

  # SMTP (transactional email) - leave all four blank to disable email (skips
  # gracefully, no error - see apps/api/src/email/email.service.ts)
  SMTP_HOST: "REPLACE_ME_OPTIONAL"
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE_ME_OPTIONAL"
  SMTP_PASSWORD: "REPLACE_ME_OPTIONAL"
  EMAIL_FROM: "PREMAL KAIZEN <premal.kaizen@gmail.com>"
  CONTACT_NOTIFICATION_EMAIL: "REPLACE_ME_OPTIONAL"
