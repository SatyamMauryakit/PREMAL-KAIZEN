# Non-secret API configuration. DATABASE_URL is deliberately NOT here - it's built
# from the premal-postgres-secret's POSTGRES_* values at the Deployment level (see
# 04-api.yaml), since it also embeds the password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: premal-api-config
  namespace: premal-kaizen
data:
  NODE_ENV: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "3002"
  # S3-backed uploads, matching deploy-compose/docker-compose.yml's production
  # setting - NOT "local", which doesn't survive a pod restart/rescheduling without
  # a PVC this manifest set deliberately doesn't provision for uploads (see the
  # PVC note in 03-postgres.yaml's header comment).
  STORAGE_DRIVER: "s3"
  AWS_REGION: "ap-south-1"
  # Filled in per-environment (the one real, environment-specific value in this
  # ConfigMap) - replace before applying.
  S3_BUCKET: "__S3_BUCKET__"
  CORS_ALLOWED_ORIGINS: "__CORS_ALLOWED_ORIGINS__"
  APP_BASE_URL: "__APP_BASE_URL__"
