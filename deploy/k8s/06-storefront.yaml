apiVersion: apps/v1
kind: Deployment
metadata:
  name: premal-storefront
  namespace: premal-kaizen
  labels:
    app.kubernetes.io/name: premal-storefront
    app.kubernetes.io/part-of: premal-kaizen
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: premal-storefront }
  template:
    metadata:
      labels: { app: premal-storefront }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: storefront
          image: premal-storefront:postgres-local # override per environment/CI
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # No dedicated health route on this app (confirmed: only the API has one) -
          # a plain 200 check against "/" is the documented safe alternative, same as
          # the Dockerfile's own HEALTHCHECK.
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet: { path: /, port: 3000 }
            failureThreshold: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: premal-storefront
  namespace: premal-kaizen
spec:
  selector: { app: premal-storefront }
  ports:
    - port: 3000
      targetPort: 3000
